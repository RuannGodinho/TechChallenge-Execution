apiVersion: v1
kind: ConfigMap
metadata:
  name: execution-config
data:
  PORT: '3001'
  NODE_ENV: production
  MONGODB_URI: 'mongodb://execution-mongo-service:27017/execution?replicaSet=execution-rs'
  AUTH_MODE: gateway
  SERVICE_ORDERS_URL: 'http://api-service'
  EXECUTION_COMPLETION_TRANSPORT: rabbitmq
  SEED_ENABLED: 'true'
