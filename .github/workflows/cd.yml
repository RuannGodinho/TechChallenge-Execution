name: CD

on:
  workflow_run:
    workflows: [Execution CI]
    types: [completed]
    branches: [main, develop, release]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "yes" to confirm deploy
        required: false
        default: ""

concurrency:
  group: cd-execution-eks
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Confirm manual deploy
        if: github.event_name == 'workflow_dispatch' && inputs.confirm != 'yes'
        run: |
          echo "::error::Manual deploy requires confirm=yes."
          exit 1

      - name: Verify CI passed (manual deploy)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ github.ref_name }}"
          CONCLUSION=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow=ci.yml \
            --branch="$BRANCH" \
            --limit=1 \
            --json conclusion \
            --jq '.[0].conclusion')
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Latest CI run on ${BRANCH} did not succeed (conclusion: ${CONCLUSION:-none}). Run CI first."
            exit 1
          fi
          echo "Latest CI on ${BRANCH}: success"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Resolve image tag
        id: image
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          if [ "$BRANCH" = "release" ]; then
            echo "tag=homolog" >> "$GITHUB_OUTPUT"
            echo "environment=homolog" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "environment=production" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ruanngodinho/techchallenge-execution:${{ steps.image.outputs.tag }}
          push: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.TF_AWS_REGION || 'us-east-1' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "${{ vars.TF_AWS_REGION || 'us-east-1' }}" \
            --name "${{ vars.TF_CLUSTER_NAME || 'techchallenge-eks' }}"

      - name: Deploy execution secrets and config
        env:
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          GATEWAY_TRUST_SECRET: ${{ secrets.GATEWAY_TRUST_SECRET }}
          SERVICE_ORDERS_INTERNAL_API_KEY: ${{ secrets.SERVICE_ORDERS_INTERNAL_API_KEY }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, os
          required = ["INTERNAL_API_KEY","GATEWAY_TRUST_SECRET","SERVICE_ORDERS_INTERNAL_API_KEY","RABBITMQ_URL"]
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit('Missing GitHub secrets: ' + ', '.join(missing))
          data = {key: os.environ.get(key, '') for key in ["INTERNAL_API_KEY","GATEWAY_TRUST_SECRET","SERVICE_ORDERS_INTERNAL_API_KEY","RABBITMQ_URL","JWT_SECRET"]}
          payload = {'apiVersion': 'v1', 'kind': 'Secret', 'metadata': {'name': 'execution-secrets'}, 'type': 'Opaque', 'stringData': data}
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'execution-secrets.json'), 'w') as output:
              json.dump(payload, output)
          PY
          kubectl apply -f k8s/secrets/Api-configmap.yml
          kubectl apply -f "$RUNNER_TEMP/execution-secrets.json"
          kubectl create secret docker-registry dockerhub-cred \
            --docker-username="$DOCKERHUB_USERNAME" \
            --docker-password="$DOCKERHUB_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Wait for database and broker from TechChallenge-infra-db
        run: |
          kubectl get svc execution-mongo-service rabbitmq-service
          kubectl rollout status deployment/execution-mongo-deployment --timeout=180s
          kubectl rollout status deployment/rabbitmq-deployment --timeout=180s

      - name: Apply service instrumentation using existing New Relic operator
        run: |
          kubectl wait --for=condition=established crd/instrumentations.newrelic.com --timeout=60s
          kubectl apply -f k8s/instrumentation.yaml

      - name: Deploy API and existing HPA pattern
        run: |
          kubectl patch --local -f k8s/Api-deployment.yml --type=strategic \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"api","image":"ruanngodinho/techchallenge-execution:${{ steps.image.outputs.tag }}"}]}}}}' \
            -o yaml > "$RUNNER_TEMP/execution-api.yml"
          kubectl apply -f "$RUNNER_TEMP/execution-api.yml"
          kubectl apply -f k8s/Api-service.yml
          kubectl apply -f k8s/API-hpa.yml
          kubectl rollout restart deployment/execution-deployment
          kubectl rollout status deployment/execution-deployment --timeout=180s

      - name: Deploy grouped workers
        run: |
          kubectl patch --local -f k8s/workers-deployment.yml --type=strategic \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"workers","image":"ruanngodinho/techchallenge-execution:${{ steps.image.outputs.tag }}"}]}}}}' \
            -o yaml > "$RUNNER_TEMP/execution-workers.yml"
          kubectl apply -f "$RUNNER_TEMP/execution-workers.yml"
          kubectl rollout restart deployment/execution-workers
          kubectl rollout status deployment/execution-workers --timeout=180s

      - name: Run seed job using the existing one-time pattern
        run: |
          if ! kubectl get job execution-seed-job >/dev/null 2>&1; then
            kubectl patch --local -f k8s/api-seed-job.yml --type=strategic \
              -p '{"spec":{"template":{"spec":{"containers":[{"name":"seed","image":"ruanngodinho/techchallenge-execution:${{ steps.image.outputs.tag }}"}]}}}}' \
              -o yaml > "$RUNNER_TEMP/execution-seed.yml"
            kubectl apply -f "$RUNNER_TEMP/execution-seed.yml"
          fi
          kubectl wait --for=condition=complete job/execution-seed-job --timeout=120s

      - name: Write job summary
        run: |
          {
            echo "## execution deploy"
            echo "Image: ruanngodinho/techchallenge-execution:${{ steps.image.outputs.tag }}"
            kubectl get deploy execution-deployment execution-workers
            kubectl get svc execution-service
            kubectl get hpa execution-hpa
          } >> "$GITHUB_STEP_SUMMARY"
