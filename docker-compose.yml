services:
  mongodb:
    image: mongo:8
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - execution_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
  execution:
    build: .
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/execution
    ports:
      - "3001:3001"
    depends_on:
      mongodb:
        condition: service_healthy
volumes:
  execution_data:
